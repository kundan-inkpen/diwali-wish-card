<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>रिंगटोन / मैसेज टोन</title>
<style>
  :root {
    --orange: #f2711c;
    --orange-soft: #fde7d3;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --bg-top: #fdebd6;
    --bg: #fffaf4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans Devanagari", "Mukta", system-ui, sans-serif;
    background: #e9e4de;
    display: flex; justify-content: center; padding: 24px 0;
  }
  .phone {
    width: 369px; min-height: 800px; overflow: hidden;
    background: linear-gradient(var(--bg-top), var(--bg) 180px);
    border-radius: 28px; box-shadow: 0 10px 40px rgba(0,0,0,.18);
    position: relative;
  }
  /* crops from the reference screenshot (738x1600 shown at half scale) */
  .sprite {
    background-image: url("assets/ringtone-ref.jpeg");
    background-size: 369px 800px;
    background-repeat: no-repeat;
  }

  .status { height: 28px; padding: 6px 20px; font-size: 13px; color: #333; display: flex; justify-content: space-between; }
  .header { display: flex; align-items: center; gap: 16px; padding: 14px 18px 10px; }
  .header .back { font-size: 22px; color: var(--text); }
  .header h1 { font-size: 20px; font-weight: 700; color: var(--text); }

  /* ---- NEW: रिंगटोन / मैसेज टोन tabs ---- */
  .type-tabs {
    margin: 4px 16px 12px; padding: 4px;
    display: flex; background: var(--orange-soft); border-radius: 999px;
  }
  .type-tabs button {
    flex: 1; border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--orange);
    padding: 8px 0; border-radius: 999px; transition: background .2s, color .2s;
  }
  .type-tabs button.active { background: var(--orange); color: #fff; box-shadow: 0 2px 6px rgba(242,113,28,.35); }

  .deities { display: flex; gap: 14px; padding: 0 0 0 10px; overflow-x: auto; scrollbar-width: none; }
  .deity { flex: 0 0 auto; width: 54px; text-align: center; padding-bottom: 6px; border-bottom: 2px solid transparent; cursor: pointer; }
  .deity.active { border-color: var(--text); }
  .deity .icon { width: 46px; height: 46px; margin: 0 auto 6px; border-radius: 12px; }
  .deity span { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .deity.active span { color: var(--text); font-weight: 600; }

  .banner {
    margin: 14px 15px 0; height: 124px; border-radius: 12px; position: relative; overflow: hidden;
    background: linear-gradient(100deg, #fcefd9, #f9d9a8);
    padding: 18px 16px;
  }
  .banner h2 { font-size: 19px; color: #8a2d0c; }
  .banner p { font-size: 13px; color: #4a3b30; margin-top: 2px; font-weight: 600; }
  .banner .go { margin-top: 12px; width: 42px; height: 28px; border-radius: 14px; background: var(--orange); color: #fff; display: grid; place-items: center; font-size: 16px; }
  .banner .art { position: absolute; right: 0; top: 0; width: 109px; height: 124px; background-position: -245px -182px; }

  .section-title { font-size: 17px; font-weight: 700; color: var(--text); margin: 22px 15px 6px; }
  .list { padding: 0 15px 30px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
  .thumb { width: 50px; height: 50px; border-radius: 6px; flex: 0 0 auto; }
  .thumb.tone { display: grid; place-items: center; font-size: 24px; background: linear-gradient(135deg, #fff1df, #fbd3a4); }
  .meta { flex: 1; min-width: 0; }
  .meta .name { font-size: 15px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .dur { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .play { color: #8d93a3; font-size: 18px; width: 22px; text-align: center; }
  .set { border: 1.5px solid var(--orange); color: var(--orange); background: transparent; font: inherit; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 5px 20px; }
  .more { color: #999; font-size: 18px; width: 12px; text-align: center; }
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>2:58</span><span>22%</span></div>

  <div class="header">
    <span class="back">←</span>
    <h1 id="title">रिंगटोन</h1>
  </div>

  <!-- NEW TAB SWITCHER -->
  <div class="type-tabs" role="tablist">
    <button class="active" data-type="ringtone" role="tab">रिंगटोन</button>
    <button data-type="message" role="tab">मैसेज टोन</button>
  </div>

  <div class="deities">
    <div class="deity active"><div class="icon sprite" style="background-position:-12px -90px"></div><span>आपके लिए</span></div>
    <div class="deity"><div class="icon sprite" style="background-position:-79px -90px"></div><span>शिव जी</span></div>
    <div class="deity"><div class="icon sprite" style="background-position:-141px -90px"></div><span>राम जी</span></div>
    <div class="deity"><div class="icon sprite" style="background-position:-202px -90px"></div><span>कृष्ण जी</span></div>
    <div class="deity"><div class="icon sprite" style="background-position:-267px -90px"></div><span>हनुमान जी</span></div>
    <div class="deity"><div class="icon sprite" style="background-position:-331px -90px"></div><span>दुर्गा जी</span></div>
  </div>

  <div class="banner">
    <h2>Surendra जी</h2>
    <p id="banner-text">अपने नाम की रिंगटोन बनाएं</p>
    <div class="go">→</div>
    <div class="art sprite"></div>
  </div>

  <div class="section-title">पॉपुलर</div>
  <div class="list" id="list"></div>
</div>

<script>
  const data = {
    ringtone: {
      title: "रिंगटोन",
      banner: "अपने नाम की रिंगटोन बनाएं",
      items: [
        { name: "लो आ गया बजरंग बाला", thumb: "-15px -375px" },
        { name: "राधे-राधे बोल", thumb: "-15px -448px" },
        { name: "परदेसिया की पुकार", thumb: "-15px -521px" },
        { name: "नगरी हो अयोध्या सी", thumb: "-15px -595px" },
        { name: "दुर्गा माँ रिंगटोन", thumb: "-15px -668px" },
      ],
    },
    message: {
      title: "मैसेज टोन",
      items: [
        { name: "मंदिर की घंटी", icon: "🔔", dur: "0:02" },
        { name: "शंख ध्वनि", icon: "🐚", dur: "0:03" },
        { name: "ॐ नमः शिवाय", icon: "🕉️", dur: "0:03" },
        { name: "जय श्री राम", icon: "🏹", dur: "0:02" },
        { name: "राधे राधे", icon: "🪈", dur: "0:02" },
        { name: "जय माता दी", icon: "🪔", dur: "0:03" },
      ],
    },
  };

  const list = document.getElementById("list");

  function render(type) {
    const d = data[type];
    document.getElementById("title").textContent = d.title;
    const banner = document.querySelector(".banner");
    banner.style.display = d.banner ? "" : "none";
    if (d.banner) document.getElementById("banner-text").textContent = d.banner;
    list.innerHTML = d.items.map(it => `
      <div class="row">
        ${it.thumb
          ? `<div class="thumb sprite" style="background-position:${it.thumb}"></div>`
          : `<div class="thumb tone">${it.icon}</div>`}
        <div class="meta">
          <div class="name">${it.name}</div>
          ${it.dur ? `<div class="dur">${it.dur}</div>` : ""}
        </div>
        <span class="play">▶</span>
        <button class="set">सेट</button>
        <span class="more">⋮</span>
      </div>`).join("");
  }

  document.querySelectorAll(".type-tabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".type-tabs button").forEach(b => b.classList.toggle("active", b === btn));
      render(btn.dataset.type);
    });
  });

  render("ringtone");
</script>
</body>
</html>
